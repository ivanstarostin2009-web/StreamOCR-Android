
name: Build StreamOCR APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StreamOCR_Android_Project_v2.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q StreamOCR_Android_Project_v2.zip -d extracted
          ls -la extracted/StreamOCR_Android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Build APK
        run: |
          gradle -p extracted/StreamOCR_Android --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamOCR-debug-apk
          path: extracted/StreamOCR_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
